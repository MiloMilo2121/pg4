# OpenSSF Scorecard: a supply-chain posture report (pinned actions, signed
# releases, branch protection, fuzzing, …). It is advisory — it publishes a
# badge and a SARIF upload; it does not gate the build.
#
# It runs only on the public release repo. On a private repository the default
# GITHUB_TOKEN cannot make the GraphQL queries Scorecard needs ("Resource not
# accessible by integration"), and results can't be published for a private
# repo anyway. On the public repo, publishing authenticates with OIDC
# (`id-token: write`), so no extra secret is involved.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Monday 04:05 UTC — the upstream recommendation, off the hour on purpose.
    - cron: '5 4 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'MiloMilo2121/pg4'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the SARIF artifact
        # Uploaded as an artifact too, so the report survives even when the
        # upstream SARIF upload is not configured for the repository.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
          if-no-files-found: ignore
