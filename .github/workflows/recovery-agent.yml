name: Recovery agent
run-name: Recovery ${{ github.event.client_payload.incident_id || inputs.incident_id || 'manual' }} attempt ${{ github.event.client_payload.recovery_attempt || 'manual' }}

on:
  repository_dispatch:
    types: [pg4_recovery_requested]
  workflow_dispatch:
    inputs:
      incident_id:
        description: 24-character incident id matching the envelope
        required: true
        type: string
      incident_envelope:
        description: Compact recovery envelope JSON (no logs, outputs, or secrets)
        required: true
        type: string

# Duplicate GitHub deliveries are possible after a VPS crash between durable
# dispatch intent and the API response. Serialize by validated incident id;
# do not cancel a running diagnosis/review cycle.
concurrency:
  group: recovery-${{ github.event.client_payload.incident_id || inputs.incident_id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose-fix-review:
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.pr.outputs.pr_url }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize sanitized incident envelope
        env:
          EVENT_NAME: ${{ github.event_name }}
          INCIDENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_ENVELOPE: ${{ inputs.incident_envelope }}
          REQUESTED_INCIDENT_ID: ${{ github.event.client_payload.incident_id || inputs.incident_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const incidentId = process.env.REQUESTED_INCIDENT_ID || '';
          if (!/^[a-f0-9]{24}$/.test(incidentId)) throw new Error('invalid incident id');
          const payload = process.env.EVENT_NAME === 'repository_dispatch'
            ? JSON.parse(process.env.INCIDENT_PAYLOAD || '{}')
            : { envelope: JSON.parse(process.env.MANUAL_ENVELOPE || '{}') };
          const envelope = payload.envelope;
          if (!envelope || envelope.version !== 1 || envelope.incident_id !== incidentId ||
            typeof envelope.run_id !== 'string' || envelope.run_id.length === 0 || envelope.run_id.length > 256 ||
            typeof envelope.generated_at !== 'string' || !Number.isFinite(Date.parse(envelope.generated_at)) ||
            typeof envelope.output_csv !== 'string' || envelope.output_csv.length === 0 || envelope.output_csv.length > 2048 ||
            !Array.isArray(envelope.failures) || envelope.failures.length < 1 || envelope.failures.length > 20) {
            throw new Error('invalid compact recovery envelope');
          }
          const recoveryErrorClasses = new Set([
            'network_exhausted', 'maps_no_feed', 'selector_drift', 'consent_wall',
            'blocked_or_captcha', 'checkpoint_integrity', 'unknown',
          ]);
          for (const failure of envelope.failures) {
            if (!failure || typeof failure.key !== 'string' || failure.key.length > 512 || !['pg', 'maps'].includes(failure.provider) ||
              typeof failure.category !== 'string' || failure.category.length > 256 ||
              typeof failure.location !== 'string' || failure.location.length > 256 ||
              !recoveryErrorClasses.has(failure.error_class) ||
              (failure.page !== undefined && (!Number.isInteger(failure.page) || failure.page < 1)) ||
              (failure.reason !== undefined && (typeof failure.reason !== 'string' || failure.reason.length > 800)) ||
              (failure.url !== undefined && (typeof failure.url !== 'string' || failure.url.length > 2_048)) ||
              (failure.page_title !== undefined && (typeof failure.page_title !== 'string' || failure.page_title.length > 500)) ||
              (failure.screenshot_path !== undefined && (typeof failure.screenshot_path !== 'string' || failure.screenshot_path.length > 512 ||
                failure.screenshot_path.startsWith('/') || failure.screenshot_path.split(/[\\/]/).includes('..'))) ||
              (failure.evidence_fingerprint !== undefined && !/^[a-f0-9]{8,64}$/i.test(failure.evidence_fingerprint))) {
              throw new Error('invalid recovery failure record');
            }
          }
          fs.mkdirSync('.recovery', { recursive: true });
          fs.writeFileSync('.recovery/incident.json', `${JSON.stringify(envelope)}\n`, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `RECOVERY_INCIDENT_ID=${incidentId}\n`);
          NODE
      - name: Verify PR credential
        env:
          GH_TOKEN: ${{ secrets.RECOVERY_GH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'RECOVERY_GH_TOKEN is required to open the recovery PR'; exit 1; }
      - name: Create recovery branch
        run: git checkout -b "recovery/$RECOVERY_INCIDENT_ID"
      - name: Generate constrained patch
        env:
          OPENROUTER_ENABLED: 'true'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: anthropic/claude-opus-4-8
        run: pnpm exec tsx src/scripts/recovery_agent.ts patch .recovery/incident.json
      - name: Mechanical pre-review
        run: |
          git diff --check
          pnpm run typecheck
          pnpm test
          pnpm run lint
      - name: Independent AI pre-review
        env:
          OPENROUTER_ENABLED: 'true'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: anthropic/claude-opus-4-8
        run: pnpm exec tsx src/scripts/recovery_agent.ts review .recovery/incident.json
      - name: Commit and create PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RECOVERY_GH_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          test -n "$RECOVERY_INCIDENT_ID"
          test -n "$(git status --short)"
          git config user.name "pg4-recovery-agent[bot]"
          git config user.email "pg4-recovery-agent[bot]@users.noreply.github.com"
          gh auth setup-git
          git add src tests
          git commit -m "fix(recovery): remediate $RECOVERY_INCIDENT_ID"
          git push --set-upstream origin HEAD
          PR_URL="$(gh pr create --base main --head "$(git branch --show-current)" --title "fix(recovery): $RECOVERY_INCIDENT_ID" --body "Automated recovery patch. CI, regression tests and independent pre-review passed.")"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The patch is LLM-generated from an envelope that carries scraped text
  # (page titles, error reasons) — a prompt-injection surface. Merging to main
  # therefore runs in the protected `recovery-merge` environment: configure
  # "Required reviewers" on it (Settings → Environments) so a human approves
  # every merge. The VPS coordinator waits for this run to conclude, so the
  # campaign resumes only once the reviewed fix is on main (no approval within
  # RECOVERY_WAIT_SECONDS → the cell is marked blocked for a human).
  merge:
    needs: diagnose-fix-review
    runs-on: ubuntu-latest
    environment: recovery-merge
    steps:
      - name: Wait for PR checks, then merge the reviewed commit
        env:
          GH_TOKEN: ${{ secrets.RECOVERY_GH_TOKEN }}
          PR_URL: ${{ needs.diagnose-fix-review.outputs.pr_url }}
          HEAD_SHA: ${{ needs.diagnose-fix-review.outputs.head_sha }}
        run: |
          test -n "$GH_TOKEN"
          test -n "$PR_URL"
          test -n "$HEAD_SHA"
          gh pr checks "$PR_URL" --watch --fail-fast
          gh pr merge "$PR_URL" --merge --delete-branch --match-head-commit "$HEAD_SHA"
