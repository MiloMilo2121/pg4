# Static analysis for JavaScript/TypeScript. Catches the class of bug that
# unit tests miss: injection sinks, unsafe deserialization, prototype pollution.
#
# It runs on its own schedule as well as on PRs: a dependency bump or a new
# query pattern can introduce a sink without touching TypeScript.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sunday 03:20 UTC. Off the hour on purpose — the top of the hour is when
    # every scheduled workflow on GitHub tries to start at once.
    - cron: '20 3 * * 0'

permissions:
  contents: read

# The default CodeQL set ships JavaScript queries that assume a Node runtime.
# pg4 also has a Next.js dashboard, so the JS-extended set covers both.
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Code scanning needs GitHub Advanced Security, which private repos only
      # get on a paid plan. Probing beats `continue-on-error: true`, which
      # would also swallow a genuine analysis failure once the feature is on.
      # When it is available the job runs and uploads; until then it says why
      # it skipped and turns green, instead of red on every push.
      - name: Probe for code scanning availability
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/code-scanning" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Code scanning is not enabled for this repository; skipping CodeQL. Enable it under Settings -> Code security to turn analysis on."
          fi

      - if: steps.probe.outputs.available == 'true'
        uses: github/codeql-action/init@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - if: steps.probe.outputs.available == 'true'
        uses: github/codeql-action/analyze@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          category: '/language:${{ matrix.language }}'
